name: build_Release

on:
  workflow_dispatch:

env:
  VERSION: '2.0.11'
  BUNDLEID: 'com.zqbb.Dopamine'
  THEOS: ${{ github.workspace }}/theos
  THEOS_SDK_VERSION: '16.5'
  # 修改此版本可主动刷新编译环境缓存。
  BUILD_CACHE_VERSION: 'v1'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main
        with:
            submodules: recursive

      - name: Prepare cache keys
        id: cache-info
        run: |
          echo "macos=$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"
          mkdir -p .ci-cache

      - name: Restore Procursus environment
        id: procursus-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/procursus.tar.zst
          key: procursus-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-info.outputs.macos }}-${{ env.BUILD_CACHE_VERSION }}-${{ steps.cache-info.outputs.month }}

      - name: Extract Procursus environment
        if: steps.procursus-cache.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /opt
          zstd -dc .ci-cache/procursus.tar.zst | sudo tar -xpf - -C /opt

      - name: Install Procursus
        if: steps.procursus-cache.outputs.cache-hit != 'true'
        uses: dhinakg/procursus-action@main
        with:
          # 已缓存完整环境，避免 action 再缓存一份未安装工具的 bootstrap。
          cache: 'false'
          packages: ldid findutils sed coreutils make xz-utils

      - name: Configure Procursus environment
        run: |
          for procursus_path in games sbin bin local/sbin local/bin; do
            echo "/opt/procursus/$procursus_path" >> "$GITHUB_PATH"
          done
          echo "CPATH=/opt/procursus/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/opt/procursus/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Archive Procursus environment
        if: steps.procursus-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar -cpf - -C /opt procursus | zstd -T0 -3 -o .ci-cache/procursus.tar.zst

      - name: Save Procursus environment
        if: steps.procursus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/procursus.tar.zst
          key: ${{ steps.procursus-cache.outputs.cache-primary-key }}

      - name: Restore Homebrew downloads
        id: brew-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-info.outputs.macos }}-${{ env.BUILD_CACHE_VERSION }}-${{ steps.cache-info.outputs.month }}

      - name: Install Homebrew dependencies
        run: |
          for formula in make libarchive openssl@3; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Save Homebrew downloads
        if: steps.brew-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ steps.brew-cache.outputs.cache-primary-key }}

      - name: Restore Theos and SDK
        id: theos-cache
        uses: actions/cache/restore@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-info.outputs.macos }}-sdk${{ env.THEOS_SDK_VERSION }}-${{ env.BUILD_CACHE_VERSION }}-${{ steps.cache-info.outputs.month }}

      - name: Install THEOS
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          # 依赖已准备好，直接克隆可避免安装器再次执行 apt update。
          git clone --recursive --depth 1 --shallow-submodules https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          sdk_archive="$RUNNER_TEMP/iPhoneOS${THEOS_SDK_VERSION}.sdk.tar.xz"
          curl -fL --retry 3 "https://github.com/theos/sdks/releases/latest/download/iPhoneOS${THEOS_SDK_VERSION}.sdk.tar.xz" --output "$sdk_archive"
          tar -xJf "$sdk_archive" -C "$THEOS/sdks"
          rm "$sdk_archive"

      - name: Verify Theos environment
        run: |
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS${THEOS_SDK_VERSION}.sdk"

      - name: Save Theos and SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: theos
          key: ${{ steps.theos-cache.outputs.cache-primary-key }}

      - name: Get trustcache dependency version
        id: trustcache-info
        run: |
          echo "openssl=$(brew list --versions openssl@3 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore trustcache tool
        id: trustcache-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/bin/trustcache
          key: trustcache-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-info.outputs.macos }}-${{ steps.trustcache-info.outputs.openssl }}-${{ env.BUILD_CACHE_VERSION }}-${{ steps.cache-info.outputs.month }}

      - name: Build trustcache
        if: steps.trustcache-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          git clone --depth 1 https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl@3)/include -arch $(uname -m)"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl@3)/lib -arch $(uname -m)"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache/bin"
          cp trustcache "$GITHUB_WORKSPACE/.ci-cache/bin/trustcache"

      - name: Save trustcache tool
        if: steps.trustcache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/bin/trustcache
          key: ${{ steps.trustcache-cache.outputs.cache-primary-key }}

      - name: Install trustcache tool
        run: |
          sudo install -m 755 .ci-cache/bin/trustcache /opt/procursus/bin/trustcache
      
      - name: Pre Bundleid
        run: |
          sed -i '' "s/com.opa334.Dopamine/${{ env.BUNDLEID }}/g" ./Application/Dopamine/Jailbreak/DOPreferenceManager.m
          sed -i '' "s/com.opa334.Dopamine/${{ env.BUNDLEID }}/g" ./Application/Dopamine.xcodeproj/project.pbxproj
          sed -i '' "s/com.opa334.Dopamine/${{ env.BUNDLEID }}/g" ./BaseBin/jbctl/src/main.m

      - name: Pre Version
        run: |
          set -x
          orig_version=$(cat ./BaseBin/_external/basebin/.version)
          if [[ "${{ env.VERSION }}" > "$orig_version" ]]; then
            echo "${{ env.VERSION }}" >./BaseBin/_external/basebin/.version
            sed -i '' 's/MARKETING_VERSION = .*;/MARKETING_VERSION = ${{ env.VERSION }};/g' ./Application/Dopamine.xcodeproj/project.pbxproj
          fi
          echo "newVERSION=$(cat ./BaseBin/_external/basebin/.version)" >> $GITHUB_ENV

      - name: Pre env
        run: |
          sT=$(TZ=UTC-8 date +'%S')
          echo "msT=$(TZ=UTC-8 date -j -f "%Y-%m-%d %H:%M:%S" "$(TZ=UTC-8 date +'%Y-%m-%d %H:%M'):${sT}" +%s)" >> $GITHUB_ENV
          echo "shT=$(TZ=UTC-8 date +'%Y.%m.%d/%H.%M').${sT}" >> $GITHUB_ENV
          echo "logT=$(TZ=UTC-8 date +'%Y年%m月%d %H:%M'):${sT}" >> $GITHUB_ENV
          echo "SHASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "commitCount=$(curl -s "https://api.github.com/repos/opa334/Dopamine/commits?per_page=1" -I | grep -i 'link' | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')" >> $GITHUB_ENV


      - name: Log env
        run: |
          echo ${{ env.newVERSION }}
          echo ${{ env.msT }}
          echo ${{ env.shT }}
          echo ${{ env.logT }}
          echo ${{ env.SHASH }}
          echo ${{ env.commitCount }}

      - name: Pre code
        run: |
          sed -i '' "s/AAAA/v${{ env.newVERSION }}  ${{ env.commitCount }}  ${{ env.msT }}/g" ./Application/Dopamine/UI/DOMainViewController.m
          sed -i '' "s/AAAB/不要为了升级而放弃越狱的乐趣~/g" ./Application/Dopamine/UI/DOMainViewController.m
          sed -i '' "s/AAAB/不要为了升级而放弃越狱的乐趣~/g" ./Application/Dopamine/UI/DOMainViewController.m
          sed -i '' "s/opa334/w2599/g" ./Application/Dopamine/UI/Settings/DOCreditsViewController.m
          sed -i '' "s/opa334/w2599/g" ./Application/Dopamine/UI/Update/DOUpdateViewController.m
          sed -i '' "s/opa334/w2599/g" ./Application/Dopamine/UI/DOUIManager.m
          
      - name: Pre body
        run: |
          echo -e "版本：${{ env.newVERSION }}\n编译时间戳：${{ env.msT }}\n北京时间：${{ env.shT }}" >> body.txt
          echo -e "\n> **增删改：**" >> body.txt
          echo -e "> - ${{ env.logT }}" >> body.txt
          echo -e "> - .1设置界面新增挂载按钮.在最底下~~" >> body.txt
          echo -e "> - .2越狱时自动挂载/var/jb/mnt/newFakePath.plist里面的目录" >> body.txt
          echo -e "> - .3修复更新越狱工具相关代码" >> body.txt
          echo -e "> - .4添加开机时间显示" >> body.txt
          echo -e "> - .5添加禁止更新检测" >> body.txt

      - name: Pre xcode-select
        run: |
          # sudo xcode-select --switch /Applications/Xcode_14.3.app

      - name: Restore Bootstraps
        id: bootstrap-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Application/Dopamine/Resources/bootstrap_1800.tar.zst
            Application/Dopamine/Resources/bootstrap_1900.tar.zst
          key: bootstraps-${{ env.BUILD_CACHE_VERSION }}-${{ steps.cache-info.outputs.month }}-${{ hashFiles('Application/Dopamine/Resources/download_bootstraps.sh') }}

      - name: Pre Bootstraps
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        run: |
          cd Application/Dopamine/Resources
          ./download_bootstraps.sh

      - name: Verify Bootstraps
        run: |
          zstd -t Application/Dopamine/Resources/bootstrap_1800.tar.zst Application/Dopamine/Resources/bootstrap_1900.tar.zst

      - name: Save Bootstraps
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Application/Dopamine/Resources/bootstrap_1800.tar.zst
            Application/Dopamine/Resources/bootstrap_1900.tar.zst
          key: ${{ steps.bootstrap-cache.outputs.cache-primary-key }}

      - name: Pre Fix
        run: |
          sed -i '' 's/\/include/\/include -I..\/.include/g' BaseBin/XPF/Makefile

      - name: Build tipa
        run: |
          # set -x
          gmake -j$(sysctl -n hw.physicalcpu) NIGHTLY=1
          # cp Dopamine/Dopamine.tipa Dopamine.tipa
          mv Application/Dopamine.tipa Dopamine_${{ env.newVERSION }}_${{ env.commitCount }}_${{ env.msT }}_${{ env.SHASH }}.ipa

      - name: Upload Latest Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@main
        with:
          name: Dopamine_Latest
          path: |
            *.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.newVERSION }}
          tag_name: ${{ env.newVERSION }}
          body_path: body.txt
          prerelease: false
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          files: |
           *.ipa
